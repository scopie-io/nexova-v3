<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEXOVA AI — Links to live store, in real time</title>
<meta name="description" content="Paste your TikTok Shop or Shopee link and watch your online store go live.">
<meta name="theme-color" content="#f8f8fa">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Satoshi-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" type="image/webp" imagesrcset="/v2/img/helmet-640.webp 640w, /v2/img/helmet.webp 1280w" imagesizes="(max-width: 900px) 78vw, 34vw">
<link rel="stylesheet" href="/v2/css/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- ===== header ===== -->
  <header class="top">
    <a class="brand" href="/" aria-label="Nexova">
      <img class="logo" src="/v2/img/logo-nexova-dark.svg" alt="Nexova" width="673" height="106">
      <span class="tagline">LINKS TO LIVE STORE, IN REAL TIME.</span>
    </a>
    <div class="top-right">
      <button type="button" class="text-btn" id="sound-toggle">SOUND ON</button>
      <button type="button" class="text-btn" id="options-toggle">OPTIONS</button>
      <!-- the state: ONLINE at rest, the beat while it builds, LIVE when the store is up -->
      <span class="live" id="live"><i></i><b id="live-text">ONLINE</b></span>
    </div>
  </header>

  <!-- ===== hero ===== -->
  <main class="hero">
    <!-- left: the stage — caption beside the head, the head centred, the live store preview -->
    <section class="stage" id="stage" data-state="idle">
      <div class="caption">
        <div class="callout-name">NEXOVA AI</div>
        <ul class="steps" id="steps" aria-label="NEXOVA AI status">
          <li data-step="thinking">THINKING</li>
          <li data-step="designing">DESIGNING</li>
          <li data-step="building">BUILDING</li>
          <li data-step="live">IN REAL TIME</li>
        </ul>
        <span class="rule" aria-hidden="true"></span>
        <!-- what the head is saying -->
        <p class="say" id="say" aria-live="polite"></p>
      </div>

      <div class="figure">
        <div class="head" id="head" data-state="idle">
          <img class="head-shadow" src="/v2/img/helmet-shadow.webp" alt="" aria-hidden="true" width="1114" height="142" decoding="async">
          <div class="head-tilt">
            <div class="head-body">
              <img class="head-img" src="/v2/img/helmet.webp" srcset="/v2/img/helmet-640.webp 640w, /v2/img/helmet.webp 1280w" sizes="(max-width: 900px) 78vw, 34vw" alt="NEXOVA AI" width="1280" height="1022" decoding="async" fetchpriority="high">
              <!-- the life on the visor, drawn in the helmet image's own coordinates -->
              <svg class="head-fx" viewBox="0 0 1093 873" aria-hidden="true">
                <defs>
                  <clipPath id="visor-clip"><ellipse cx="549" cy="498" rx="356" ry="258"/></clipPath>
                  <filter id="line-glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="16"/></filter>
                  <filter id="mask-blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
                  <linearGradient id="sweep-grad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#9fd3ff" stop-opacity="0"/>
                    <stop offset=".5" stop-color="#bfe3ff" stop-opacity=".22"/>
                    <stop offset="1" stop-color="#9fd3ff" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <g clip-path="url(#visor-clip)">
                  <rect class="fx-sweep" x="0" y="180" width="260" height="640" fill="url(#sweep-grad)" transform="skewX(-18)"/>
                </g>
                <!-- while it speaks, the painted line is covered in glass colour and the waveform drawn instead -->
                <path class="fx-mask" d="M311,610.5 Q545,660 779,610.5" filter="url(#mask-blur)"/>
                <path class="fx-glow" d="M311,610.5 Q545,660 779,610.5" pathLength="1"/>
                <path class="fx-line" d="M311,610.5 Q545,660 779,610.5" pathLength="1"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- live store preview: the head steps aside and the store renders here -->
        <div class="preview" id="preview" hidden>
          <div class="preview-bar">
            <span class="preview-title"><i></i><span id="preview-name">LIVE</span></span>
            <div class="preview-actions">
              <button type="button" id="pv-desktop" class="on">DESKTOP</button>
              <button type="button" id="pv-mobile">MOBILE</button>
              <button type="button" id="pv-open">OPEN</button>
              <button type="button" id="pv-close">CLOSE</button>
            </div>
          </div>
          <div class="device" id="device">
            <!-- our own published store, same origin: no sandbox, or its module scripts (crossorigin) cannot load -->
            <iframe id="pv-frame" title="Live store preview"></iframe>
          </div>
        </div>
      </div>
    </section>

    <!-- right: the conversation -->
    <section class="chat">
      <div class="card" id="card">
        <div class="options" id="options" hidden>
          <label>Template
            <select id="opt-template"><option value="">Let Nexova choose</option></select>
          </label>
          <label>Currency
            <input id="opt-currency" placeholder="Auto" maxlength="3" autocomplete="off">
          </label>
          <label class="wide">Instructions
            <input id="opt-instructions" placeholder="e.g. premium tone, Malay copy" autocomplete="off">
          </label>
          <label class="check"><input type="checkbox" id="opt-skip-discovery"> Skip looking for other channels</label>
          <label class="check"><input type="checkbox" id="opt-skip-research"> Skip web research</label>
          <label class="check"><input type="checkbox" id="opt-skip-build"> Store data only, no site</label>
        </div>
        <div class="messages" id="messages"></div>

        <div class="chips" id="chips"></div>
        <div class="files" id="files-strip" hidden></div>

        <form class="composer" id="composer" autocomplete="off">
          <textarea id="input" rows="1" placeholder="TikTok Shop / Shopee link" aria-label="TikTok Shop or Shopee link"></textarea>
          <input type="file" id="files" multiple accept="image/png,image/jpeg,image/webp,image/gif,.csv,.tsv,.json,.txt" hidden>
          <button type="submit" class="send" id="send">BUILD</button>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/v2/js/app.js"></script>
</body>
</html>
