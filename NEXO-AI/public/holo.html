<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO hologram — dev view</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <!-- Dev view: the hologram alone on black at full size (?state=speaking|thinking|building|listening) -->
  <canvas id="holo"></canvas>
  <script type="module">
    import { Hologram, HoloState } from './js/hologram.js';
    const holo = new Hologram(document.getElementById('holo'));
    window.nexo = { holo, HoloState };
    const s = new URLSearchParams(location.search).get('state');
    if (s) setTimeout(() => holo.setState(s), 3200);
  </script>
</body>
</html>
